name: Build AC Infinity Dashboard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write Clean Manifest
        run: python3 -c 's="<manifest xmlnsQandroid=\"httpQ//://android.com\"><uses-permission androidQname=\"android.permission.INTERNET\"/><application androidQlabel=\"AC Infinity\" androidQusesCleartextTraffic=\"true\" androidQtheme=\"@style/Theme.AppCompat.NoActionBar\"><activity androidQname=\".MainActivity\" androidQexported=\"true\" androidQscreenOrientation=\"landscape\"><intent-filter><action androidQname=\"android.intent.action.MAIN\"/><category androidQname=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>".replace("Q",chr(58)); open("app/src/main/AndroidManifest.xml","w").write(s)'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ac-infinity-dashboard
          path: app/build/outputs/apk/debug/app-debug.apk
