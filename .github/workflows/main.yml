name: Build AC Infinity Dashboard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and Auto-Fix Code
        run: |
          python3 part1.py && python3 part2.py
          python3 -c 'f="app/src/main/java/com/example/acinfinity/MainActivity.kt"; s=open(f).read().replace(").map { i ->", ").forEach { i ->").replace("ControllerData(\n", "list.add(ControllerData(\n").replace("                }\n                handler.post", "                })\n                handler.post").replace("val list = (0 until arr.length())", "val list = mutableListOf<ControllerData>(); (0 until arr.length())"); open(f,"w").write(s)'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ac-infinity-dashboard
          path: app/build/outputs/apk/debug/app-debug.apk
