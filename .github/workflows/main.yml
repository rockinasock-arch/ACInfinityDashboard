name: Build AC Infinity Dashboard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Clean Code
        run: |
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode(""))'
          python3 m1.py && python3 m2.py && python3 part2.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ac-infinity-dashboard
          path: app/build/outputs/apk/debug/app-debug.apk
